<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Diego Cortes, AI Solutions Engineer">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="repeat">
      <stop offset="0" stop-color="#f2c46d"/>
      <stop offset="0.33" stop-color="#5eead4"/>
      <stop offset="0.66" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#f2c46d"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.12" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#f2c46d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2c46d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0 0;40 40" dur="4s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .rise { animation: rise 1.2s ease-out both; }
      .rise2 { animation: rise 1.2s .35s ease-out both; }
      .rise3 { animation: rise 1.2s .7s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .trace { stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -32 } }
      .spin { transform-origin: 960px 160px; animation: spin 14s linear infinite; }
      .spinr { transform-origin: 960px 160px; animation: spin 9s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .pulse { transform-origin: 960px 160px; animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(.85); opacity: .7 } 50% { transform: scale(1.1); opacity: 1 } }
      .p { animation: up 7s linear infinite; }
      @keyframes up { from { transform: translateY(0); opacity: 0 } 15% { opacity: .8 } to { transform: translateY(-340px); opacity: 0 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#000"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow1)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>

    <!-- particles -->
    <g fill="#5eead4">
      <circle class="p" cx="120" cy="330" r="1.6" style="animation-delay:0s"/>
      <circle class="p" cx="260" cy="330" r="1.2" style="animation-delay:2.1s"/>
      <circle class="p" cx="420" cy="330" r="1.8" style="animation-delay:4.3s"/>
      <circle class="p" cx="560" cy="330" r="1.2" style="animation-delay:1.2s"/>
      <circle class="p" cx="700" cy="330" r="1.5" style="animation-delay:3.4s"/>
      <circle class="p" cx="1120" cy="330" r="1.4" style="animation-delay:5.2s"/>
    </g>
    <g fill="#f2c46d">
      <circle class="p" cx="340" cy="330" r="1.3" style="animation-delay:1.7s"/>
      <circle class="p" cx="640" cy="330" r="1.1" style="animation-delay:5.8s"/>
      <circle class="p" cx="1060" cy="330" r="1.6" style="animation-delay:2.9s"/>
    </g>

    <!-- circuit traces into the AI core -->
    <g fill="none" stroke-width="1.5">
      <path id="c1" d="M760 60 H860 L900 120 H925" stroke="#3b82f6" stroke-opacity=".35"/>
      <path id="c2" d="M760 260 H860 L900 200 H925" stroke="#3b82f6" stroke-opacity=".35"/>
      <path id="c3" d="M1180 70 H1080 L1030 125 H995" stroke="#f2c46d" stroke-opacity=".35"/>
      <path id="c4" d="M1180 250 H1080 L1030 195 H995" stroke="#f2c46d" stroke-opacity=".35"/>
      <path d="M760 60 H860 L900 120 H925" stroke="#5eead4" class="trace"/>
      <path d="M1180 250 H1080 L1030 195 H995" stroke="#5eead4" class="trace" style="animation-delay:.8s"/>
    </g>
    <circle r="3" fill="#5eead4"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion></circle>
    <circle r="3" fill="#5eead4"><animateMotion dur="2.6s" begin=".6s" repeatCount="indefinite"><mpath href="#c2"/></animateMotion></circle>
    <circle r="3" fill="#f2c46d"><animateMotion dur="2.4s" begin=".3s" repeatCount="indefinite"><mpath href="#c3"/></animateMotion></circle>
    <circle r="3" fill="#f2c46d"><animateMotion dur="2s" begin="1s" repeatCount="indefinite"><mpath href="#c4"/></animateMotion></circle>

    <!-- AI core -->
    <g class="spin" fill="none">
      <circle cx="960" cy="160" r="68" stroke="#3b82f6" stroke-opacity=".5" stroke-dasharray="4 8"/>
      <circle cx="1028" cy="160" r="4" fill="#3b82f6"/>
    </g>
    <g class="spinr" fill="none">
      <circle cx="960" cy="160" r="50" stroke="#f2c46d" stroke-opacity=".55" stroke-dasharray="60 24"/>
      <circle cx="910" cy="160" r="3.5" fill="#f2c46d"/>
    </g>
    <circle cx="960" cy="160" r="30" stroke="#5eead4" stroke-opacity=".7" fill="none"/>
    <circle class="pulse" cx="960" cy="160" r="26" fill="url(#core)"/>

    <!-- scan line -->
    <rect x="0" y="-60" width="1200" height="60" fill="url(#scan)">
      <animate attributeName="y" values="-60;320" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- text -->
    <text x="70" y="88" class="t rise" font-size="15" letter-spacing="4" fill="#5eead4">&gt; SYSTEM ONLINE<tspan class="blink">_</tspan></text>
    <text x="68" y="160" class="t rise" font-size="70" font-weight="700" fill="url(#name)">Diego Cortes</text>
    <text x="70" y="208" class="t rise2" font-size="27" fill="#f4f4f6">AI Solutions Engineer</text>
    <text x="70" y="248" class="t rise3" font-size="20" fill="#8b9099">AI agents and automated systems that bring businesses more revenue</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#5eead4" stroke-opacity=".25"/>
</svg>
