<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="divider">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="#3b82f6" stroke-opacity=".25"/>
  <rect x="-240" y="11" width="240" height="2" fill="url(#pulse)">
    <animate attributeName="x" values="-240;1200" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cy="12" r="3" fill="#f2c46d">
    <animate attributeName="cx" values="1200;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
